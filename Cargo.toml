[package]
name = "sudoku"
version = "0.1.0"
edition = "2021"
description = "Sudoku web application server"
authors = ["Sudoku Team"]

[[bin]]
name = "sudoku"
path = "src/server/main.rs"

[lib]
name = "sudoku"
path = "src/server/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower_governor = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
thiserror = "2"

sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
tower = "0.5"
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
